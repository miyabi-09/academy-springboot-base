<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ポートフォリオです">
    <title>項目一覧ページ</title>
    <!-- head内のCSSリンクを置き換え（キャッシュ対策のv付き推奨） -->
    <link rel="stylesheet" th:href="@{/css/common.css(v=${T(java.time.LocalDate).now()})}">
    <link rel="stylesheet" th:href="@{/css/skills-new.css(v=${T(java.time.LocalDateTime).now().toString()})}">
</head>

<body>
    <div class="wrapper">

    <header class="header">
        <a class="header-logo" th:href="@{/home}" aria-label="トップへ">My Portfolio</a>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="header-button">ログアウト</button>
            </form>
    </header>

    <div class="main-content">
                <form th:action="@{/skills/new}" method="post" th:object="${userForm}" novalidate>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" name="categoryName" th:value="${categoryName}">
                    <input type="hidden" name="categoryId" th:value="${categoryId}">
                    <input type="hidden" th:field="*{month}">

                    <h1 class="main-title" th:text="|${categoryName}に項目を追加|">項目一覧ページ</h1>
                    <div class="form-container">
                        <div class="form-group">
                            <label for="name">項目名</label>
                            <input type="text" class="form-control" th:field="*{name}" id="name" placeholder="項目名を入力してください"/>
                            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>
                        <div class="form-group">
                            <label for="studyTime">学習時間</label>
                            <div class="number-stepper">
                            <input type="number"
                                    class="form-control learning-hours-input minutes-input"
                                    th:field="*{studyTime}"
                                    id="studyTime"
                                    min="0" max="1440" step="1" inputmode="numeric"
                                    placeholder="学習時間を入力してください"
                                    th:attr="aria-invalid=${#fields.hasErrors('studyTime')},
                                        aria-describedby=${#fields.hasErrors('studyTime')} ? 'studyTimeError' : 'studyTimeHelp'"/>


                                <!-- 三角はテキストなし。CSSの ::before で描画 -->
                                <button type="button" class="step up"   aria-label="1分増やす"></button>
                                <button type="button" class="step down" aria-label="1分減らす"></button>
                            </div>
                            <!-- ヘルパー（エラーなしのときだけ） -->
                            <small id="studyTimeHelp" class="form-helper"
                                    th:if="${!#fields.hasErrors('studyTime')}">
                                分単位で入力してください
                            </small>

                            <!-- エラー（赤字） -->
                            <div id="studyTimeError" class="text-danger"
                                th:if="${#fields.hasErrors('studyTime')}"
                                th:text="${#fields.errors('studyTime')[0] ?: '学習時間は0以上の数字で入力してください'}">
                                学習時間は0以上の数字で入力してください
                            </div>
                        </div>
                        
                        <div class="button-wrapper">
                            <button type="submit" class="submit-btn">追加する</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>


    <footer>
        <div class="footer">portfolio site</div>
    </footer>

    <!-- 追加：保存完了モーダル（flash が来ているときだけ描画） -->
    <dialog class="modal-wrapper" id="addedModal" th:if="${addedName}">
    <p class="added-msg">
        <span th:text="${addedCategory}">バックエンド</span>に
        <span th:text="${addedName}">java</span>を<br>
        <span th:text="${addedStudyTime}">2</span>分で追加しました！
    </p>
    <div class="modal-btn-wrapper">
        <a class="modal-btn" th:href="@{/skills(month=${selectedMonth})}">編集ページに戻る</a>
    </div>
    </dialog>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dlg = document.getElementById('addedModal');
            if (!dlg) return;
            if (typeof dlg.showModal === 'function') {
            dlg.showModal();
            } else {
            // 古いブラウザ用フォールバック
            dlg.setAttribute('open', '');
            }
        });
    </script> 
    <script defer th:src="@{/js/skills.js(v=${T(java.time.LocalDateTime).now().toString()})}"></script>

</body>
</html>
