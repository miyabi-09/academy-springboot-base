<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ポートフォリオです">
    <title>項目一覧ページ</title>
    <link rel="stylesheet" th:href="@{/css/common.css(v=${T(java.time.LocalDate).now()})}">
    <link rel="stylesheet" th:href="@{/css/skills.css(v=${T(java.time.LocalDateTime).now().toString()})}">
</head>

<body>
    <div class="wrapper">

    <header class="header">
        <a class="header-logo" th:href="@{/home}" aria-label="トップへ">My Portfolio</a>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="header-button">ログアウト</button>
            </form>
    </header>

    <div class="main-content">
        <div class="skills-header">

            <!-- プルダウン -->
        <div class="select-wrap">
            <button type="button" id="monthBtn" class="month-dropdown-btn" aria-haspopup="listbox" aria-expanded="false">
                <span id="monthLabel" th:text="${selectedMonthLabel}">9月</span>
                <span class="caret">▼</span>
                </button>

                <ul id="monthMenu" class="month-menu" role="listbox" hidden>
                <li th:each="m : ${months}"
                    role="option"
                    th:attr="data-value=${m.value()}, aria-selected=${m.value()==selectedMonth}"
                    th:classappend="${m.value()==selectedMonth} ? ' is-selected'"
                    th:text="${m.label()}">
                    9月
                </li>
                </ul>

                <form id="monthForm" th:action="@{/skills-legacy}" method="get">
                    <input type="hidden" name="month" id="monthInput" th:value="${selectedMonth}">
                </form>
        </div> 
        </div>   

            <div class="skills-container">
                <!-- バックエンド -->
                <div class="category-box">
                    <div class="category-header">
                        <h2 class="category-title">バックエンド</h2>
                        <a class="skill-edit-btn"
                            th:href="@{/skills/new(categoryName='バックエンド', month=${selectedMonth})}">
                            項目を追加する</a>   
                    </div>
                    <div class="skills-list">
                        <table>
                            <thead>
                                <tr>
                                    <th>項目名</th>
                                    <th>学習時間</th>
                                    <th aria-hidden="true"></th>
                                </tr>
                            </thead>
                            <!-- バックエンド -->
                            <tbody id="tbody-backend" th:with="skillsSafe=${skills ?: T(java.util.Collections).emptyList()},list=${skillsSafe.?[category?.name == 'バックエンド']}">
                                <tr th:each="s : ${list}">
                                    <td th:text="${s.name}"></td>
                                    <td>
                                    <div class="number-stepper">
                                        <input type="number"
                                            class="learning-hours-input minutes-input"
                                            min="0" max="1440" step="1" inputmode="numeric"
                                            th:value="${s.studyTime}"
                                            th:attr="data-id=${s.id}, data-category=${s.category.name}">
                                        <button type="button" class="step up"   aria-label="1分増やす"></button>
                                        <button type="button" class="step down" aria-label="1分減らす"></button>
                                    </div>
                                    </td>
                                    
                                    <td class="input-button-wrapper">
                                        <!-- 保存 -->
                                        <form th:action="@{/skills/update}" method="post" style="display:inline;">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                            <input type="hidden" name="id"    th:value="${s.id}" />
                                            <input type="hidden" name="month" th:value="${selectedMonth}" />
                                            <!-- JSがここに minutes を詰めます（initSaveFormsGlue） -->
                                            <input type="hidden" name="minutes" value="" />
                                            <button type="submit" class="small-btn save-btn"
                                                    th:attr="data-id=${s.id}, data-category=${s.category.name}">
                                            学習時間を保存する
                                            </button>
                                        </form>

                                        <!-- 削除 -->
                                        <form class="delete-form" th:action="@{/skills/delete}" method="post" style="display:inline;">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                            <input type="hidden" name="id"    th:value="${s.id}" />
                                            <input type="hidden" name="month" th:value="${selectedMonth}" />
                                            <button type="submit" class="delete-btn"
                                                    th:attr="data-id=${s.id}, data-category=${s.category.name}">
                                            削除する
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(list)}">
                                    <td colspan="3" style="text-align:center;color:#666;">データがありません</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- フロントエンド -->
                <div class="category-box">
                    <div class="category-header">
                        <h2 class="category-title">フロントエンド</h2>
                        <a class="skill-edit-btn"
                        th:href="@{/skills/new(categoryName='フロントエンド', month=${selectedMonth})}">
                        項目を追加する</a>
                    </div>
                    <div class="skills-list">
                        <table>
                            <thead>
                                <tr>
                                    <th>項目名</th>
                                    <th>学習時間</th>
                                    <th aria-hidden="true"></th>
                                </tr>
                            </thead>
                            <!-- フロントエンド -->
                            <tbody id="tbody-frontend" th:with="skillsSafe=${skills ?: T(java.util.Collections).emptyList()},list=${skillsSafe.?[category?.name == 'フロントエンド']}">
                            <tr th:each="s : ${list}">
                                <td th:text="${s.name}"></td>
                                <td>
                                <div class="number-stepper">
                                    <input type="number"
                                        class="learning-hours-input minutes-input"
                                        min="0" max="1440" step="1" inputmode="numeric"
                                        th:value="${s.studyTime}"
                                        th:attr="data-id=${s.id}, data-category=${s.category.name}">
                                        <button type="button" class="step up"   aria-label="1分増やす"></button>
                                    <button type="button" class="step down" aria-label="1分減らす"></button>
                                </div>
                                </td>
                                
                                <td class="input-button-wrapper">
                                    <!-- 保存 -->
                                    <form th:action="@{/skills/update}" method="post" style="display:inline;">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <input type="hidden" name="id"    th:value="${s.id}" />
                                        <input type="hidden" name="month" th:value="${selectedMonth}" />
                                        <!-- JSがここに minutes を詰めます（initSaveFormsGlue） -->
                                        <input type="hidden" name="minutes" value="" />
                                        <button type="submit" class="small-btn save-btn"
                                                th:attr="data-id=${s.id}, data-category=${s.category.name}">
                                        学習時間を保存する
                                        </button>
                                    </form>

                                    <!-- 削除 -->
                                    <form class="delete-form" th:action="@{/skills/delete}" method="post" style="display:inline;">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <input type="hidden" name="id"    th:value="${s.id}" />
                                        <input type="hidden" name="month" th:value="${selectedMonth}" />
                                        <button type="submit" class="delete-btn"
                                                th:attr="data-id=${s.id}, data-category=${s.category.name}">
                                        削除する
                                        </button>
                                    </form>
                                </td>

                            </tr>
                            <tr th:if="${#lists.isEmpty(list)}">
                                <td colspan="3" style="text-align:center;color:#666;">データがありません</td>
                            </tr>
                        </tbody>
                        </table>
                    </div>
                </div>

                <!-- インフラ -->
                <div class="category-box">
                    <div class="category-header">
                        <h2 class="category-title">インフラ</h2>
                        <a class="skill-edit-btn"
                            th:href="@{/skills/new(categoryName='インフラ', month=${selectedMonth})}">
                            項目を追加する</a>          
                    </div>
                    <div class="skills-list">
                        <table>
                            <thead>
                                <tr>
                                    <th>項目名</th>
                                    <th>学習時間</th>
                                    <th aria-hidden="true"></th>
                                </tr>
                            </thead>
                            <!-- インフラ -->
                            <tbody id="tbody-infra" th:with="skillsSafe=${skills ?: T(java.util.Collections).emptyList()},list=${skillsSafe.?[category?.name == 'インフラ']}">
                            <tr th:each="s : ${list}">
                                <td th:text="${s.name}"></td>
                                <td>
                                <div class="number-stepper">
                                    <input type="number"
                                        class="learning-hours-input minutes-input"
                                        min="0" max="1440" step="1" inputmode="numeric"
                                        th:value="${s.studyTime}"
                                        th:attr="data-id=${s.id}, data-category=${s.category.name}">
                                    <button type="button" class="step up"   aria-label="1分増やす"></button>
                                    <button type="button" class="step down" aria-label="1分減らす"></button>
                                </div>
                                </td>
                                <td class="input-button-wrapper">
                                    <!-- 保存 -->
                                    <form th:action="@{/skills/update}" method="post" style="display:inline;">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <input type="hidden" name="id"    th:value="${s.id}" />
                                        <input type="hidden" name="month" th:value="${selectedMonth}" />
                                        <!-- JSがここに minutes を詰めます（initSaveFormsGlue） -->
                                        <input type="hidden" name="minutes" value="" />
                                        <button type="submit" class="small-btn save-btn"
                                                th:attr="data-id=${s.id}, data-category=${s.category.name}">
                                        学習時間を保存する
                                        </button>
                                    </form>

                                    <!-- 削除 -->
                                    <form class="delete-form" th:action="@{/skills/delete}" method="post" style="display:inline;">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <input type="hidden" name="id"    th:value="${s.id}" />
                                        <input type="hidden" name="month" th:value="${selectedMonth}" />
                                        <button type="submit" class="delete-btn"
                                                th:attr="data-id=${s.id}, data-category=${s.category.name}">
                                        削除する
                                        </button>
                                    </form>
                                </td>

                            </tr>
                            <tr th:if="${#lists.isEmpty(list)}">
                                <td colspan="3" style="text-align:center;color:#666;">データがありません</td>
                            </tr>
                        </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <footer>
        <div class="footer">portfolio site</div>
    </footer>

    <!-- 追加：保存完了モーダル（flash が来ているときだけ描画） --->
    <dialog class="modal-wrapper" id="addedModal" th:if="${editSuccess}">
        <p class="added-msg"
            th:text="${editedName} + 'の学習時間を保存しました！'">
        </p>
        <form method="dialog" class="modal-btn-wrapper">
            <button class="modal-btn">編集ページに戻る</button>
        </form>
    </dialog>

    <!-- 追加：削除完了モーダル（flash が来ているときだけ描画） -->
    <dialog class="modal-wrapper" id="deletedModal" th:if="${deleteSuccess}">
        <p class="added-msg"
            th:text="${deletedName} + 'を削除しました！'">
        </p>
        <form method="dialog" class="modal-btn-wrapper">
            <button class="modal-btn">編集ページに戻る</button>
        </form>
    </dialog>

    <script defer th:src="@{/js/skills.js(v=${T(java.time.LocalDateTime).now().toString()})}"></script>
</body>
</html>
