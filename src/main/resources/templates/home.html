<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="ポートフォリオです">
        <title>TOPページ</title>
        <link rel="stylesheet" href="/css/common.css">
        <!--<link rel="stylesheet" href="common.css">-->
        <link rel="stylesheet" href="/css/home.css">
        <!--<link rel="stylesheet" href="home.css">-->
    </head>

    <body>
        <div class="wrapper">

        <header class="header">
            <a class="header-logo" th:href="@{/home}" aria-label="トップへ">My Portfolio</a>
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="header-button">ログアウト</button>
                </form>
        </header>

            <div class="main-content">
                <div class="profile-section">
                    <!-- プロフィール写真 -->
                    <div class="profile-photo">
                        <div class="photo-placeholder">
                            <img th:with="ts=${user != null && user.updatedAt != null ? #temporals.format(user.updatedAt,'yyyyMMddHHmmss') : 0}" th:src="@{'/users/' + ${user.id} + '/avatar'(ts=${ts})}" alt="avatar" class="profile-img" onerror="this.src='/images/default_profile.png'">
                        </div>
                        <p class="user-name" th:text="${user?.name}"></p>
                    </div>

                    <!-- 自己紹介コンテンツ -->
                    <div class="profile-content">
                        <h1 class="profile-title">自己紹介</h1>
                        <p class="profile-text" th:text="${#strings.isEmpty(user?.introduction) ? '自己紹介がまだ未登録です' : user.introduction}"></p>
                        <a th:href="@{/profile/edit}" class="submit-profile-btn">自己紹介を編集する</a>
                    </div>
                </div>

                <!-- 学習チャートセクション -->
                <div class="study-section">
                    <div class="study-content">
                        <h1 class="study-title">学習チャート</h1>
                        <a th:href="@{/skills-legacy}" class="submit-edit-btn">編集する</a>
                        <section class="chart-box" style="width:1081px;height:532.5px;">
                            <canvas id="learningChart" class="learningChart"
                                    th:attr="data-base-month=${#dates.format(#dates.createNowForTimeZone('Asia/Tokyo'),'yyyy-MM')}"
                                    width="960" height="360"
                                    aria-label="スキル学習時間チャート"></canvas>
                        </section>
                    </div>
                </div>
            </div>

            <footer>
                <div class="footer">
                    <span th:if="${user != null}" th:text="${user.name}">ユーザー名</span>
                </div>  
            </footer>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script defer th:src="@{/js/learning-chart.js(v=${T(java.time.LocalDateTime).now().toString()})}"></script>

    </body>
</html>
